name: Stage 2 controller regression tests

on:
  push:
    paths:
      - "mathematical-concept-agent/**"
      - ".github/workflows/stage2-controller-tests.yml"
  pull_request:
    paths:
      - "mathematical-concept-agent/**"
      - ".github/workflows/stage2-controller-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Python 3.10 / full controller suite
            os: windows-latest
            pattern: "test_*.py"
          - name: Ubuntu / Python 3.10 / crash recovery contract
            os: ubuntu-latest
            pattern: "test_checkpoint_recovery.py"

    env:
      # Command-construction tests only require a resolvable executable path;
      # no Codex process is launched by the offline suite.
      CODEX_EXECUTABLE: python

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run Stage 2 controller regression tests
        run: python -m unittest discover -s mathematical-concept-agent/tests -p "${{ matrix.pattern }}" -v
